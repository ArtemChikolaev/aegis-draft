name: Data refresh

# Крон-пересборка реального tier-1 датасета из OpenDota: resumable --collect-window
# пишет web/public/data/*.json, коммитит изменения в main и САМ запускает CI-деплой (шаг в конце):
# push дефолтным GITHUB_TOKEN `on: push` не триггерит — это документированное поведение GitHub, и
# бот-коммиты 2026-09-14…18 не дали ни одного прогона CI: датасет доезжал до Pages только со
# следующим человеческим пушем (аудит 2026-09-19).
# Сбор resumable: raw-кэш персистится между запусками (actions/cache), каждый прогон
# добирает до дневного потолка Free Tier (~3000 req/day), полное окно доезжает за
# несколько дней дейлик-крона. Ручной старт/докрутка — workflow_dispatch.
# Discovery свежий в каждом прогоне: SQL explorer ограничен --as-of (ключ кэша меняется с
# датой), справочники /leagues, /teams, /heroes живут в кэше 20 ч, детали матчей — навсегда
# (pipeline/README.md, «Raw-кэш и свежесть discovery»).
on:
  schedule:
    - cron: "0 6 * * *" # ежедневно 06:00 UTC
  workflow_dispatch:
    inputs:
      window:
        description: "Окно сбора: last_1y|last_2y|last_5y"
        default: "last_5y"
      requestBudget:
        description: "Максимум реальных HTTP attempts за прогон (< 3000/day Free Tier)"
        default: "2000"
      minEventMatches:
        description: "Порог матчей на событие (tier-1 шум)"
        default: "8"
      maxMatchesPerLeague:
        description: "Потолок деталей на событие (0 = без потолка, нужен для pro career parity с 322-0)"
        default: "0"
      dryRun:
        description: "true = собрать и показать распределение OVR, но НЕ коммитить данные"
        default: "false"

permissions:
  contents: write # коммит обновлённых данных в main
  actions: write # запуск CI-деплоя после бот-коммита (gh workflow run)

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Бюджет 2000 запросов укладывается в ~40 мин; каждый 429 — минута ожидания, и без потолка прогон упирался бы в
    # 6-часовой лимит раннера, теряя по пути raw-кэш.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pipeline/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Персистим raw-кэш OpenDota между прогонами: resumable-сбор продолжает с первого
      # cache miss, а не начинает с нуля. Rolling key + restore-keys накапливают кэш.
      # restore и save — раздельно: единый actions/cache сохраняет ТОЛЬКО при зелёном джобе, и любой красный
      # шаг ниже выбрасывал всё скачанное за прогон (до дневной квоты Free Tier) — см. шаг «Save» в конце.
      - name: Restore OpenDota raw cache
        uses: actions/cache/restore@v4
        with:
          path: pipeline/data/raw
          key: opendota-raw-${{ github.run_id }}
          restore-keys: |
            opendota-raw-
      - name: Collect real tier-1 dataset from OpenDota (resumable window)
        working-directory: pipeline
        # Входы — через env, а не подстановкой в текст скрипта: джоб пишет в main, и `${{ inputs.* }}` внутри `run`
        # исполнялся бы как shell.
        env:
          WINDOW: ${{ github.event.inputs.window || 'last_5y' }}
          MIN_EVENT_MATCHES: ${{ github.event.inputs.minEventMatches || '8' }}
          MAX_MATCHES_PER_LEAGUE: ${{ github.event.inputs.maxMatchesPerLeague || '0' }}
          REQUEST_BUDGET: ${{ github.event.inputs.requestBudget || '2000' }}
        run: |
          go run ./cmd/build \
            --fetch-opendota --emit-domain --collect-window \
            --window "$WINDOW" \
            --min-event-matches "$MIN_EVENT_MATCHES" \
            --max-matches-per-league "$MAX_MATCHES_PER_LEAGUE" \
            --request-budget "$REQUEST_BUDGET" \
            --as-of "$(date -u +%F)" \
            --out ../web/public/data \
            --schema-validator ../.claude/skills/data-contract/tools/validate_data.mjs
      - name: Save OpenDota raw cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: pipeline/data/raw
          key: opendota-raw-${{ github.run_id }}
      - name: Sanity check (непустой датасет)
        run: |
          node -e "const p=require('./web/public/data/packs.json'); if(!Array.isArray(p)||p.length===0){console.error('пустой packs.json — не коммитим');process.exit(1)}; console.log('packs:',p.length)"
      # Форма датасета: размеры файлов, состав squadSynergy, команд на valve_legacy-событие.
      # Ловит протечку квалов внутрь leagueId (реальный TI = 16–20 команд, с квалами = 40–70)
      # и рост файлов. Локально не проверить — сырьё живёт в кэше этого джоба.
      - name: Форма датасета (файлы, группы, valve_legacy)
        continue-on-error: true
        run: node .claude/skills/data-contract/tools/dataset_shape.mjs
      # Калибровка шкалы OVR — единственное место, где её видно на ПОЛНОМ датасете: сырьё
      # OpenDota живёт в кэше этого джоба, локально его не пересобрать (Free Tier ~дни).
      # Печатает распределение против референса и константы для rating.Default(). Сеть до
      # 322-0 может отвалиться — это не повод валить рефреш, поэтому continue-on-error.
      - name: Распределение OVR против референса (калибровка)
        continue-on-error: true
        run: node .claude/skills/scoring-model/tools/calibrate_ovr.mjs
      # Зеркало арта (T11.2) пополняется отдельным прогоном `npm run gen:art` — он поднимает
      # Chromium, и тащить браузер в ежедневный крон ради пары новых команд незачем. Но
      # расхождение должно быть ВИДНО: новая команда без локального знака просто не покажется
      # офлайн (в онлайне отработает фолбэк на CDN). Проверка ходит только по файловой системе.
      - name: Полнота зеркала арта (новые команды)
        continue-on-error: true
        working-directory: web
        run: node scripts/mirror_art.mjs --check
      - name: Commit & push refreshed data
        if: ${{ github.event.inputs.dryRun != 'true' }}
        run: |
          git config user.name "aegis-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/public/data
          # manifest.builtAt меняется каждым прогоном, а dataHash покрывает только файлы данных —
          # поэтому «данные не изменились» = ничего, кроме manifest.json, не поменялось. Иначе
          # каждый день уходил бы пустой коммит с полным CI и деплоем Pages.
          if git diff --cached --quiet -- . ':!web/public/data/manifest.json'; then
            git reset -q
            git checkout -- web/public/data
            echo "Данные не изменились — коммит не нужен"
            exit 0
          fi
          git commit -m "chore(data): refresh dataset $(date -u +%F)"
          git pull --rebase origin main
          git push
          # CI + деплой Pages на свежем main (условие deploy в ci.yml пускает workflow_dispatch).
          gh workflow run ci.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
