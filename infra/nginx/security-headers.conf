# Security headers (минимальный набор для lab/staging). Подключается в server И в каждом
# location с собственным add_header: у nginx add_header на вложенном уровне ОТМЕНЯЕТ наследование
# всех add_header уровня выше — без include ни один ответ не получал бы эти заголовки.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
